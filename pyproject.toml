[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat_search"
version = "0.2.0"
description = "Telegram chat downloader"
requires-python = ">=3.11"
authors = [{name = "krapotkin"}]
dependencies = [
    "telethon>=1.36.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html2text>=2024.2.26",
    "fire>=0.6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "textual>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["chat_search*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"